# Minimal local Supabase config. Schema, RLS, and RPCs are added in U2.
project_id = "supercomment"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
# Guests sign in anonymously (R5/U2). They receive the `authenticated` role with
# an `is_anonymous` JWT claim and can write only through the security-definer
# RPCs. Stale anonymous users are pruned by an ops job (deferred follow-up).
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true
